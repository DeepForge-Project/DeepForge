name: DeepForge CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LLVM_VERSION: 22.1.8
  FRONTEND_VERSION: 1.24.0
  CMAKE_VERSION: 4.4.0

jobs:
  importer-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip
          python3 -m pip install --user --break-system-packages "cmake==${CMAKE_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned cuDNN Frontend serialization reference
        run: |
          git clone --branch "v${FRONTEND_VERSION}" --depth 1 \
            https://github.com/NVIDIA/cudnn-frontend.git .deps/cudnn-frontend
      - name: Configure importer-only build
        run: |
          cmake -S . -B build-importer -G Ninja \
            -DDEEPFORGE_ENABLE_MLIR=OFF \
            -DDEEPFORGE_BUILD_TOOLS=OFF \
            -DDEEPFORGE_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/cudnn-frontend"
      - name: Build and test importer
        run: |
          cmake --build build-importer -j2
          ctest --test-dir build-importer --output-on-failure

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip zlib1g-dev
          python3 -m pip install --user --break-system-packages "cmake==${CMAKE_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned cuDNN Frontend serialization reference
        run: |
          git clone --branch "v${FRONTEND_VERSION}" --depth 1 \
            https://github.com/NVIDIA/cudnn-frontend.git .deps/cudnn-frontend
      - name: Restore LLVM/MLIR install
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: .deps/llvm-${{ env.LLVM_VERSION }}
          key: ${{ runner.os }}-x86_64-llvm-${{ env.LLVM_VERSION }}-gcc-release-v1
      - name: Build pinned LLVM/MLIR
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "llvmorg-${LLVM_VERSION}" --depth 1 \
            https://github.com/llvm/llvm-project.git .deps/llvm-project
          cmake -S .deps/llvm-project/llvm -B .deps/llvm-build -G Ninja \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_BUILD_TESTS=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps/llvm-${LLVM_VERSION}"
          cmake --build .deps/llvm-build --target install -j2
      - name: Configure DeepForge
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/llvm-${LLVM_VERSION};$GITHUB_WORKSPACE/.deps/cudnn-frontend" \
            -DDEEPFORGE_BUILD_TESTS=ON \
            -DDEEPFORGE_BUILD_TOOLS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build and test
        run: |
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Reproduce release artifact and benchmark smoke
        run: |
          build/tools/deepforge-compile test/fixtures/conv2d_f32_c17.json \
            --input-format=auto --target=x86-64 --emit=object \
            --dump-ir=imported:build/ci-imported.mlir \
            --dump-ir=bufferized:build/ci-bufferized.mlir \
            --dump-ir=llvm:build/ci-llvm.mlir \
            -o build/ci-conv2d.dfo
          build/tools/deepforge-compile --inspect build/ci-conv2d.dfo
          build/tools/deepforge-benchmark --profile=small --iterations=1
      - uses: actions/upload-artifact@v6
        with:
          name: deepforge-x86-64-artifacts
          path: |
            build/ci-conv2d.dfo
            build/ci-imported.mlir
            build/ci-bufferized.mlir
            build/ci-llvm.mlir
          if-no-files-found: error

  sanitizer:
    needs: full
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            cxx_flags: -fsanitize=address -fno-omit-frame-pointer
            linker_flags: -fsanitize=address
            environment: ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          - name: ubsan
            cxx_flags: -fsanitize=undefined -fno-sanitize=vptr -fno-omit-frame-pointer
            linker_flags: -fsanitize=undefined
            environment: UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip zlib1g-dev
          python3 -m pip install --user --break-system-packages "cmake==${CMAKE_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned cuDNN Frontend serialization reference
        run: |
          git clone --branch "v${FRONTEND_VERSION}" --depth 1 \
            https://github.com/NVIDIA/cudnn-frontend.git .deps/cudnn-frontend
      - name: Restore LLVM/MLIR install
        uses: actions/cache@v5
        with:
          path: .deps/llvm-${{ env.LLVM_VERSION }}
          key: ${{ runner.os }}-x86_64-llvm-${{ env.LLVM_VERSION }}-gcc-release-v1
          fail-on-cache-miss: true
      - name: Configure ${{ matrix.name }}
        run: |
          cmake -S . -B "build-${{ matrix.name }}" -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/llvm-${LLVM_VERSION};$GITHUB_WORKSPACE/.deps/cudnn-frontend" \
            -DDEEPFORGE_BUILD_TESTS=ON \
            -DDEEPFORGE_BUILD_TOOLS=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
      - name: Build and test ${{ matrix.name }}
        run: |
          cmake --build "build-${{ matrix.name }}" -j2
          env ${{ matrix.environment }} \
            ctest --test-dir "build-${{ matrix.name }}" --output-on-failure
